services:
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    container_name: cms_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
